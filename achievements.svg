<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-label="Achievements terminal">
  <style>
    .t { font-family: 'Fira Code','SF Mono',Consolas,'Courier New',monospace; font-size: 15px; fill: #C9D1D9; }
    .g { fill: #00FF41; }
    .y { fill: #F1E05A; }
    .d { fill: #6E7681; }

    .l { opacity: 0; animation: show 0.01s forwards; }
    .l1 { animation-delay: .3s; }
    .l2 { animation-delay: 1s; }
    .l3 { animation-delay: 1.5s; }
    .l4 { animation-delay: 2s; }
    .l5 { animation-delay: 2.5s; }
    .l6 { animation-delay: 3s; }
    .l7 { animation-delay: 3.5s; }
    .l8 { animation-delay: 4.2s; }

    .cur {
      animation: blink 1s steps(1) infinite;
      animation-delay: 4.2s;
      opacity: 0;
    }

    @keyframes show {
      to { opacity: 1; }
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <rect x="1" y="1" width="798" height="368" rx="12"
        fill="#0D1117" stroke="#00FF41" stroke-opacity="0.6" stroke-width="2"/>

  <rect x="1" y="1" width="798" height="36" rx="12" fill="#161B22"/>
  <rect x="1" y="24" width="798" height="13" fill="#161B22"/>

  <circle cx="26" cy="19" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="19" r="6" fill="#FFBD2E"/>
  <circle cx="70" cy="19" r="6" fill="#27C93F"/>

  <text x="400" y="24" text-anchor="middle" class="t d" style="font-size:13px">
    yoka@lab: ~/achievements
  </text>

  <text x="24" y="70" class="t l l1">
    <tspan class="g">yoka@lab</tspan><tspan class="d">:</tspan><tspan fill="#58A6FF">~</tspan><tspan class="d">$</tspan> ./status.sh
  </text>

  <text x="24" y="108" class="t l l2">
    <tspan class="g">[✔]</tspan> Networking internship ............ <tspan class="g">completed</tspan>
  </text>

  <text x="24" y="138" class="t l l3">
    <tspan class="g">[✔]</tspan> First Project ............ <tspan class="g">completed</tspan>
  </text>

  <text x="24" y="168" class="t l l4">
    <tspan class="y">[~]</tspan> Linux commands ............... <tspan class="y">in progress</tspan>
  </text>

  <text x="24" y="198" class="t l l5">
    <tspan class="y">[~]</tspan> Beginner CTFs ................... <tspan class="y">in progress</tspan>
  </text>

  <text x="24" y="228" class="t l l6">
    <tspan class="y">[~]</tspan> SQL &amp; Databases ................ <tspan class="y">in progress</tspan>
  </text>

  <text x="24" y="258" class="t l l7">
    <tspan class="y">[~]</tspan> OverTheWire: Bandit ..... <tspan class="y">in progress</tspan>
  </text>

  <text x="24" y="298" class="t l l8">
    <tspan class="d">[ ]</tspan> Incoming .. <tspan class="d">planned</tspan>
  </text>

  <text x="24" y="338" class="t l l8">
    <tspan class="g">yoka@lab</tspan><tspan class="d">:</tspan><tspan fill="#58A6FF">~</tspan><tspan class="d">$</tspan>
  </text>

  <rect x="172" y="325" width="9" height="16" fill="#00FF41" class="cur"/>
</svg>
